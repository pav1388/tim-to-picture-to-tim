name: Translate README to English

on:
  push:
    paths:
      - 'README.ru.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Translate Russian to English
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate
        with:
          text-file: README.ru.md
          target-language: "English"
          custom-instructions: "Keep technical terms in English. Don't translate code blocks, links, or image paths."

      - name: Build English README with correct language switcher
        run: |
          # 1. Записать переведённый текст
          echo "$TRANSLATED_TEXT" > README.md
          
          # 2. Создать правильную строку переключателя для английской версии
          #    Текущий язык (English) выделен жирным, русский — ссылка
          SWITCHER='**English** | [Русский](./README.ru.md)'
          
          # 3. Вставить переключатель в первую строку README.md
          #    Используем временный файл, чтобы избежать проблем с экранированием sed
          printf '%s\n\n' "$SWITCHER" > /tmp/readme_with_switcher.md
          cat README.md >> /tmp/readme_with_switcher.md
          mv /tmp/readme_with_switcher.md README.md
        env:
          TRANSLATED_TEXT: ${{ steps.translate.outputs.translated-text }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: auto-translate README.ru.md to README.md"
          title: "Update English README (auto-translated)"
          body: "Automatically translated from README.ru.md using ai-translate-action."
          branch: docs/update-english-readme
          add-paths: "README.md"
          delete-branch: true