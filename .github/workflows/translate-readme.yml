name: Translate README
on:
  push:
    paths:
      - 'README.md' # Срабатывает только при изменении README

permissions:
  contents: write
  pull-requests: write
  models: read # Необходимо для использования модели по умолчанию

jobs:
  translate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - language: Spanish
            file: README.es.md
          - language: Chinese
            file: README.zh.md
    steps:
      - uses: actions/checkout@v4

      - name: Translate
        uses: FidelusAleksander/ai-translate-action@v1
        id: translate
        with:
          text-file: README.md
          target-language: ${{ matrix.language }}
          custom-instructions: "Keep technical terms in English. Don't translate code blocks"

      - name: Save translation
        run: |
          mkdir -p docs
          echo "$TRANSLATED_TEXT" | tee docs/${{ matrix.file }}
        env:
          TRANSLATED_TEXT: ${{ steps.translate.outputs.translated-text }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: translations
          path: docs/${{ matrix.file }}

  create-pr:
    needs: translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: translations
          path: docs
          merge-multiple: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: update README translations"
          title: "Update README translations"
          body: "Automatically generated by ai-translate-action."
          branch: docs/update-readme-translations
          add-paths: "docs/README*"
          delete-branch: true